<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arcadic | Sign Up</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><a class="logo" href="index.html">ARCADIC<span>_</span></a><button class="menu-toggle">☰</button>
<nav class="nav" id="nav"><a href="index.html">HOME</a><a href="gaming.html">GAMING</a><a href="shop.html">SHOP <span class="cart-count">0</span></a><a href="blog.html">BLOG</a><a href="history.html">HISTORY</a><a class="active" href="signup.html" id="account-nav">SIGN UP</a></nav></header>
<main><section class="page-hero"><p class="eyebrow">JOIN THE ARCADE</p><h1>CREATE<br><span>ACCOUNT</span></h1><p>Join Arcadic, choose your player identity and keep track of your arcade points.</p></section>
<section class="section account-section">
<div class="account-box"><p class="eyebrow">NEW PLAYER</p><h2>SIGN UP</h2>
<form id="signup-form">
<label>EMAIL<input type="email" id="signup-email" required autocomplete="email" placeholder="player@example.com"></label>
<label>PASSWORD<input type="password" id="signup-password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label>
<label>USERNAME<input id="signup-username" required maxlength="20" placeholder="PixelPlayer"></label>
<label>DISPLAY NAME<input id="signup-display" required maxlength="30" placeholder="Your display name"></label>
<button class="btn rainbow-btn" type="submit">CREATE ACCOUNT</button>
</form><p class="small">Already have an account? <a class="text-link" href="login.html">LOG IN →</a></p></div>
</section></main><footer>© 2026 ARCADIC // INSERT COIN // KEEP PLAYING</footer><script src="script.js"></script></body></html>
